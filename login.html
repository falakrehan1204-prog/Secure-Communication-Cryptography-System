<head>

    <link rel="stylesheet" href="css/style.css">

<section class="login-page">

        <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=800&q=80" alt="Secure Authentication Digital Gate">

        <h2>Welcome Back</h2>

                <label><input type="checkbox"> Remember Me</label>
                <a href="#">Forgot Password?</a>

            <button class="btn">Login</button>
        </form>
    </div>
</section>
